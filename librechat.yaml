      baseURL: "https://generativelanguage.googleapis.com/v1beta/openai/"
      models:
        default:
          - "gemini-1.5-flash"
          - "gemini-1.5-pro"
          - "gemini-1.0-pro"
        fetch: true
      titleConvo: true
      summarize: false
      modelDisplayLabel: "Google"

