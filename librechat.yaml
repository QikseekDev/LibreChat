# ──────────────────────────────────────────────
# Model Specs — controls which preset is selected by default on a new chat.
# The entry with "default: true" is what LibreChat preselects when the user
# opens a fresh conversation (instead of remembering the last-used model).
# ──────────────────────────────────────────────
interface:
  modelSelect: true    # brings back the model dropdown / switching
  parameters: true     # optional: bring back the parameter panel
  presets: true        # optional: bring back preset
  modelSpecs:
    enforce: false
    prioritize: false
    list:
      - name: "openrouter-auto"
        label: "OpenRouter Auto"
        default: true
        description: "Default model for new chats — OpenRouter's auto routing"
        preset:
          endpoint: "OpenRouter"
          model: "openrouter/auto"
          modelLabel: "OpenRouter Auto"
# ──────────────────────────────────────────────
# COHERE — Use NATIVE provider (not OpenAI-compatible)
# Add this to your .env and enable in LibreChat UI → Settings → Providers → Cohere
# ──────────────────────────────────────────────
# COHERE_API_KEY=your_key_here
#
# Models: command-r-plus, command-r, command-light
# Embeddings: embed-english-v3.0, embed-multilingual-v3.0
# Best for: RAG, citations, tool use, embeddings
